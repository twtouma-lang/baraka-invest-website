document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x; gap:18px; align-items:center; flex-wrap:wrap;\">\n      <a href=\"#plans\" style=\"background:#FED608; color:#00348C; padding:16px 36px; border-radius:3px; font-weight:700; font-size:16px; letter-spacing:0.03em;\" style-hover=\"background:#ffffff; color:#00348C;\">Choose your coverage<\/a>\n      <a href=\"#how\" style=\"color:#ffffff; padding:16px 8px; font-size:16px; border-bottom:1px solid rgba(255,255,255,0.35);\" style-hover=\"color:#ffffff; border-bottom:1px solid #ffffff;\">See how it works \u2192<\/a>\n    <\/div>\n    <div style=\"display:flex; gap:56px; margin-top:88px; padding-top:36px; border-top:1px solid rgba(255,255,255,0.15); flex-wrap:wrap;\">\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">4<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Research categories<\/div><\/div>\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">40+<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Markets covered<\/div><\/div>\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">100%<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Shariah-screened option<\/div><\/div>\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">Quarterly<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Updated intelligence<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<section id=\"coverage\" data-screen-label=\"Coverage\" style=\"padding:110px 32px;\">\n  <div style=\"max-width:1200px; margin:0 auto;\">\n    <p style=\"margin:0 0 16px; font-size:13px; letter-spacing:0.3em; color:#0A9DDE; font-weight:700;\">COVERAGE<\/p>\n    <h2 style=\"margin:0 0 18px; font-family:'Cinzel',serif; font-weight:500; font-size:40px; color:#00348C; max-width:700px;\">Four lenses on every opportunity<\/h2>\n    <p style=\"margin:0 0 56px; font-size:17px; line-height:1.7; max-width:620px; color:#3D4756;\">Each report distils macro context, structural forces and forward risk into a briefing you can act on \u2014 before you commit capital.<\/p>\n    <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:24px;\">\n      <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid #E4EAF4; border-top:3px solid #0A9DDE; padding:32px 28px; display:flex; flex-direction:column; gap:14px; background:#ffffff;\" style-hover=\"border-top:3px solid #00348C; box-shadow:0 12px 32px rgba(0,52,140,0.08);\">\n          <div style=\"font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.14em; color:#00348C; font-weight:600;\">{{ p.name }}<\/div>\n          <p style=\"margin:0; font-size:15px; line-height:1.65; color:#3D4756;\">{{ p.desc }}<\/p>\n          <div style=\"margin-top:auto; font-size:13px; color:#8593A6; letter-spacing:0.04em;\">{{ p.meta }}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"how\" data-screen-label=\"How it works\" style=\"padding:110px 32px; background:#00348C;\">\n  <div style=\"max-width:1200px; margin:0 auto;\">\n    <p style=\"margin:0 0 16px; font-size:13px; letter-spacing:0.3em; color:#0A9DDE; font-weight:700;\">HOW IT WORKS<\/p>\n    <h2 style=\"margin:0 0 56px; font-family:'Cinzel',serif; font-weight:500; font-size:40px; color:#ffffff;\">From subscription to conviction<\/h2>\n    <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:24px;\">\n      <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n        <div style=\"background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.18); padding:36px 30px;\">\n          <div style=\"font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.2em; color:#0A9DDE; margin-bottom:18px;\">STEP {{ st.n }}<\/div>\n          <div style=\"font-weight:700; font-size:18px; color:#ffffff; margin-bottom:10px;\">{{ st.title }}<\/div>\n          <p style=\"margin:0; font-size:15px; line-height:1.7; color:#C9D5EA;\">{{ st.desc }}<\/p>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"shariah\" data-screen-label=\"Shariah\" style=\"background:#ffffff; color:#3D4756; padding:100px 32px; position:relative; overflow:hidden;\">\n  <div style=\"max-width:1200px; margin:0 auto; display:grid; grid-template-columns:1.1fr 1fr; gap:72px; align-items:center;\">\n    <div>\n      <p style=\"margin:0 0 16px; font-size:13px; letter-spacing:0.3em; color:#0A9DDE; font-weight:700;\">SHARIAH INTELLIGENCE<\/p>\n      <h2 style=\"margin:0 0 20px; font-family:'Cinzel',serif; font-weight:500; font-size:38px; line-height:1.25; color:#00348C;\">Conviction and compliance, in the same document<\/h2>\n      <p style=\"margin:0 0 20px; font-size:17px; line-height:1.75; color:#3D4756; font-weight:300;\">Most research makes you choose between insight and principle. Ours doesn't. Every BARAKA Invest report can be paired with a Shariah layer: business-activity screens, financial-ratio screens, and purification guidance \u2014 reviewed against AAOIFI standards.<\/p>\n      <p style=\"margin:0; font-size:17px; line-height:1.75; color:#3D4756; font-weight:300;\">Subscribe to Shariah coverage on its own, or add it to any country, sector or industry plan.<\/p>\n    <\/div>\n    <div style=\"display:flex; flex-direction:column; gap:16px;\">\n      <sc-for list=\"{{ shariahPoints }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid #E4EAF4; padding:22px 26px; display:flex; gap:18px; align-items:baseline; background:#F7F9FC;\">\n          <span style=\"font-family:'Cinzel',serif; font-size:20px; color:#0A9DDE;\">{{ s.n }}<\/span>\n          <div>\n            <div style=\"font-weight:700; font-size:16px; margin-bottom:4px; color:#00348C;\">{{ s.title }}<\/div>\n            <div style=\"font-size:14.5px; line-height:1.6; color:#3D4756;\">{{ s.desc }}<\/div>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"plans\" data-screen-label=\"Plans configurator\" style=\"padding:110px 32px; background:#00348C;\">\n  <div style=\"max-width:1200px; margin:0 auto;\">\n    <p style=\"margin:0 0 16px; font-size:13px; letter-spacing:0.3em; color:#0A9DDE; font-weight:700;\">SUBSCRIPTIONS<\/p>\n    <h2 style=\"margin:0 0 18px; font-family:'Cinzel',serif; font-weight:500; font-size:40px; color:#ffffff;\">Build the coverage you need<\/h2>\n    <p style=\"margin:0 0 52px; font-size:17px; line-height:1.7; max-width:640px; color:#C9D5EA;\">Pick a research category, then decide how wide to go \u2014 a single market, a curated portfolio, or everything we publish. Prefer not to subscribe? Every report is also available individually.<\/p>\n\n    <div style=\"display:grid; grid-template-columns:1.4fr 1fr; gap:32px; align-items:start;\">\n      <div style=\"background:#ffffff; padding:40px;\">\n        <div style=\"font-size:13px; letter-spacing:0.2em; color:#8593A6; font-weight:700; margin-bottom:18px;\">1 \u00b7 CHOOSE A CATEGORY<\/div>\n        <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:40px;\">\n          <sc-for list=\"{{ catChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ c.pick }}\" style=\"cursor:pointer; font-family:'Lato',sans-serif; padding:16px 10px; font-size:14.5px; font-weight:700; letter-spacing:0.04em; border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.fg }}; border-radius:3px;\">{{ c.name }}<\/button>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size:13px; letter-spacing:0.2em; color:#8593A6; font-weight:700; margin-bottom:18px;\">2 \u00b7 CHOOSE YOUR SCOPE<\/div>\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <sc-for list=\"{{ scopeRows }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ s.pick }}\" style= caption>\n        <\/figure>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"padding:110px 32px; background:#00348C;\">\n  <div style=\"max-width:820px; margin:0 auto;\">\n    <p style=\"margin:0 0 16px; font-size:13px; letter-spacing:0.3em; color:#0A9DDE; font-weight:700;\">FAQ<\/p>\n    <h2 style=\"margin:0 0 44px; font-family:'Cinzel',serif; font-weight:500; font-size:40px; color:#ffffff;\">Questions, answered<\/h2>\n    <div style=\"display:flex; flex-direction:column;\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"border-bottom:1px solid rgba(255,255,255,0.2);\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"cursor:pointer; width:100%; background:none; border:none; text-align:left; font-family:'Lato',sans-serif; display:flex; justify-content:space-between; align-items:center; gap:24px; padding:24px 4px; font-size:17px; font-weight:700; color:#ffffff;\">\n            <span>{{ f.q }}<\/span><span style=\"color:#0A9DDE; font-size:22px; font-weight:300;\">{{ f.icon }}<\/span>\n          <\/button>\n          <div style=\"display:grid; grid-template-rows:{{ f.rows }}; transition:grid-template-rows 0.35s ease;\">\n            <div style=\"overflow:hidden;\">\n              <p style=\"margin:0; padding:0 4px 26px; font-size:15.5px; line-height:1.75; color:#C9D5EA; max-width:680px; opacity:{{ f.opacity }}; transition:opacity 0.3s ease;\">{{ f.a }}<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"contact\" data-screen-label=\"Newsletter\" style=\"background:#ffffff; padding:96px 32px;\">\n  <div style=\"max-width:820px; margin:0 auto; text-align:center; color:#3D4756;\">\n    <h2 style=\"margin:0 0 16px; font-family:'Cinzel',serif; font-weight:500; font-size:36px; color:#00348C;\">Intelligence, before it's obvious<\/h2>\n    <p style=\"margin:0 0 36px; font-size:16.5px; color:#3D4756; line-height:1.7; font-weight:300;\">One briefing a week \u2014 what moved, what it means, and where our analysts are looking next. No noise.<\/p>\n    <div style=\"display:flex; gap:12px; max-width:480px; margin:0 auto;\">\n      <input value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"Your email address\" style=\"flex:1; padding:15px 18px; border:1px solid #C7D0DE; background:#ffffff; color:#3D4756; font-family:'Lato',sans-serif; font-size:15px; border-radius:3px; outline:none;\">\n      <button sc-camel-on-click=\"{{ subscribe }}\" style=\"cursor:pointer; background:#FED608; color:#00348C; border:none; padding:15px 30px; font-family:'Lato',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.03em; border-radius:3px;\">{{ subscribeLabel }}<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n\n<footer data-screen-label=\"Footer\" style=\"background:#001F54; color:#C9D5EA; padding:56px 32px;\">\n  <div style=\"max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:32px; flex-wrap:wrap;\">\n    <div style=\"display:flex; align-items:center; gap:12px;\">\n      <img src=\"6e9c141d-8717-4320-ab52-410a7c81096d\" alt=\"\" style=\"height:30px;\">\n      <span style=\"font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.12em; color:#ffffff;\">BARAKA INVEST<\/span>\n    <\/div>\n    <div style=\"display:flex; gap:28px; font-size:14px;\">\n      <a href=\"#coverage\" style=\"color:#C9D5EA;\">Coverage<\/a>\n      <a href=\"#plans\" style=\"color:#C9D5EA;\">Plans<\/a>\n      <a href=\"#shariah\" style=\"color:#C9D5EA;\">Shariah<\/a>\n      <a href=\"#faq\" style=\"color:#C9D5EA;\">FAQ<\/a>\n    <\/div>\n    <div style=\"font-size:13px; color:#6B7C9C;\">\u00a9 2026 BARAKA Invest \u00b7 Research, not investment advice.<\/div>\n  <\/div>\n<\/footer>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;stickyNav&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scrolling&quot;}, &quot;stickyPlanCard&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scrolling&quot;}}\">\nclass Component extends DCLogic {\n  state = { cat: 'countries', scope: 'single', openFaq: 0, email: '', subscribed: false };\n\n  renderVals() {\n    const cats = [\n      { id: 'countries', name: 'Countries', unit: 'country', unitPlural: 'countries', all: 'All 40+ markets' },\n      { id: 'sectors', name: 'Sectors', unit: 'sector', unitPlural: 'sectors', all: 'All 11 sectors' },\n      { id: 'industries', name: 'Industries', unit: 'industry', unitPlural: 'industries', all: 'All 60+ industries' },\n      { id: 'shariah', name: 'Shariah', unit: 'market', unitPlural: 'markets', all: 'Full Shariah universe' },\n    ];\n    const cat = cats.find(c => c.id === this.state.cat);\n    const scopes = [\n      { id: 'single', title: 'Focused', desc: `One ${cat.unit} of your choice, covered in depth.` },\n      { id: 'portfolio', title: 'Portfolio', desc: `A curated selection of ${cat.unitPlural} \u2014 you choose up to five.` },\n      { id: 'complete', title: 'Complete', desc: `${cat.all}, everything we publish in this category.` },\n      { id: 'single-report', title: 'Single report', desc: `One ${cat.unit} report, purchased individually \u2014 no subscription.` },\n      { id: 'custom', title: 'Custom report', desc: `A report commissioned to your brief \u2014 scope, ${cat.unit} and depth defined by you.` },\n    ];\n    const scope = scopes.find(s => s.id === this.state.scope);\n\n    const scopeWord = { single: 'Focused', portfolio: 'Portfolio', complete: 'Complete', 'single-report': 'Single report', custom: 'Custom report' }[this.state.scope];\n    const planDescs = {\n      single: `Deep coverage of one ${cat.unit}, refreshed quarterly with analyst commentary.`,\n      portfolio: `Up to five ${cat.unitPlural} of your choice \u2014 swap selections each quarter.`,\n      complete: this.state.cat === 'shariah'\n        ? 'Our entire Shariah-screened universe \u2014 every screen, review and update, as it publishes.'\n        : `${cat.all} \u2014 our full ${cat.name.toLowerCase()} research shelf, as it publishes.`,\n      'single-report': `One ${cat.unit} report of your choice \u2014 a one-off purchase, delivered instantly. No subscription.`,\n      custom: `Commissioned research to your exact brief \u2014 you set the ${cat.unit}, questions and depth; our analysts build it.`,\n    };\n    const baseFeatures = {\n      countries: ['Macro & market-structure briefings', 'Risk and policy outlooks', 'Quarterly analyst calls'],\n      sectors: ['Sector dynamics & valuation context', 'Thematic deep dives', 'Quarterly analyst calls'],\n      industries: ['Competitive landscape & structure', 'Company-level context', 'Quarterly analyst calls'],\n      shariah: ['AAOIFI-aligned compliance screens', 'Purification guidance', 'Quarterly scholar-reviewed updates'],\n    };\n    let planFeatures;\n    if (this.state.scope === 'single-report') {\n      planFeatures = ['One-off purchase, instant delivery', 'The current edition, in full', 'Credited toward a subscription if you upgrade'];\n    } else if (this.state.scope === 'custom') {\n      planFeatures = ['Scope and questions defined by you', 'Dedicated analyst engagement', 'Findings call on delivery'];\n    } else {\n      planFeatures = [...baseFeatures[this.state.cat], 'Quarterly report refresh & archive access'];\n    }\n    if (this.state.cat !== 'shariah') planFeatures.push('Optional Shariah layer add-on');\n\n    const faqData = [\n      { q: 'What exactly is in a BARAKA Invest report?', a: 'Each report is a structured briefing: macro or structural context, the forces shaping the next 12\u201324 months, key risks, and our analysts\\u2019 read on what it means for allocation. Reports are refreshed quarterly and archived so you can track how our view evolves.' },\n      { q: 'Can I subscribe to just one country or sector?', a: 'Yes. Every category offers a Focused plan covering a single country, sector or industry of your choice. You can widen to a Portfolio (up to five) or Complete coverage at any time \u2014 upgrades apply immediately.' },\n      { q: 'How does the Shariah coverage work?', a: 'Shariah intelligence is available two ways: as a standalone subscription covering our full screened universe, or as a layer added to any country, sector or industry plan. Screens follow AAOIFI standards \u2014 business activity, financial ratios, and purification guidance.' },\n      { q: 'Can I buy a single report without subscribing?', a: 'Yes. Every report in our catalogue is available for individual purchase and delivered instantly. If you later subscribe, recent individual purchases are credited toward your first term.' },\n      { q: 'Is this investment advice?', a: 'No. BARAKA Invest publishes research and analysis to inform your judgement. We do not manage money, execute trades, or provide personalised recommendations.' },\n    ];\n\n    return {\n      navPosition: (this.props.stickyNav ?? true) ? 'fixed' : 'static',\n      navSpacer: (this.props.stickyNav ?? true) ? '77px' : '0px',\n      planCardPosition: (this.props.stickyPlanCard ?? true) ? 'sticky' : 'static',\n      pillars: [\n        { name: 'COUNTRIES', desc: 'Macro conditions, market structure, policy direction and risk \u2014 for every economy we cover.', meta: '40+ markets \u00b7 quarterly' },\n        { name: 'SECTORS', desc: 'Where capital is flowing and why \u2014 sector dynamics, valuation context and thematic shifts.', meta: '11 sectors \u00b7 quarterly' },\n        { name: 'INDUSTRIES', desc: 'Granular competitive landscapes: who wins, who consolidates, and what changes the game.', meta: '60+ industries \u00b7 quarterly' },\n        { name: 'SHARIAH', desc: 'Compliance screens, purification guidance and a fully screened investable universe.', meta: 'AAOIFI-aligned \u00b7 quarterly review' },\n      ],\n      shariahPoints: [\n        { n: 'I', title: 'Business-activity screens', desc: 'Revenue-source analysis against prohibited activities, updated as companies evolve.' },\n        { n: 'II', title: 'Financial-ratio screens', desc: 'Debt, cash and receivables thresholds applied consistently across the universe.' },\n        { n: 'III', title: 'Purification guidance', desc: 'Clear, per-holding purification calculations \u2014 no spreadsheet archaeology.' },\n      ],\n      steps: [\n        { n: 'I', title: 'Choose your coverage', desc: 'Pick a category \u2014 countries, sectors, industries or Shariah \u2014 and how wide you want to go: one, a portfolio, or all of it.' },\n        { n: 'II', title: 'Receive the intelligence', desc: 'Reports land in your library the moment they publish, with quarterly refreshes and full archive access from day one.' },\n        { n: 'III', title: 'Decide with conviction', desc: 'Walk into every allocation decision with the context, risks and analyst judgement already distilled.' },\n      ],\n      catChips: cats.map(c => {\n        const sel = c.id === this.state.cat;\n        return { name: c.name, pick: () => this.setState({ cat: c.id }),\n          bg: sel ? '#00348C' : '#ffffff', fg: sel ? '#ffffff' : '#3D4756', border: sel ? '#00348C' : '#E4EAF4' };\n      }),\n      scopeRows: scopes.map(s => {\n        const sel = s.id === this.state.scope;\n        return { title: s.title, desc: s.desc, pick: () => this.setState({ scope: s.id }),\n          bg: sel ? '#F0F5FD' : '#ffffff', border: sel ? '#0A9DDE' : '#E4EAF4',\n          dot: sel ? '#0A9DDE' : '#ffffff', dotBorder: sel ? '#0A9DDE' : '#C7D0DE' };\n      }),\n      planTitle: `${cat.name} \u00b7 ${scopeWord}`,\n      planDesc: planDescs[this.state.scope],\n      planFeatures,\n      quotes: [\n        { slotId: 'avatar-1', text: 'The country briefings replaced three separate research feeds for us. Tighter, faster, and the risk sections are genuinely honest.', name: 'F. Al-Rashid', role: 'CIO, single-family office' },\n        { slotId: 'avatar-2', text: 'Finally \u2014 Shariah screening that sits inside the analysis instead of bolted on afterwards. It changed how our committee works.', name: 'H. Osman', role: 'Head of Islamic Investments' },\n        { slotId: 'avatar-3', text: 'We buy the industry reports \u00e0 la carte before every major position. The cost is a rounding error against one avoided mistake.', name: 'M. Delacroix', role: 'Partner, private investment firm' },\n      ],\n      faqs: faqData.map((f, i) => ({ ...f, open: this.state.openFaq === i, icon: this.state.openFaq === i ? '\u2212' : '+',\n        rows: this.state.openFaq === i ? '1fr' : '0fr', opacity: this.state.openFaq === i ? 1 : 0,\n        toggle: () => this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i })) })),\n      email: this.state.email,\n      setEmail: e => this.setState({ email: e.target.value }),\n      subscribe: () => this.setState({ subscribed: true }),\n      subscribeLabel: this.state.subscribed ? 'Subscribed \u2713' : 'Subscribe',\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
  </script>
