<script id="bk-gate-js">
(function () {
  var PW = "BARAKAINVEST65";
  var KEY = "bk_gate_ok_v1";
  var TTL = 1209600000; // 14 days
  function unlocked() {
    try {
      var v = localStorage.getItem(KEY);
      if (!v) return false;
      if (Date.now() - parseInt(v, 10) > TTL) { localStorage.removeItem(KEY); return false; }
      return true;
    } catch (e) { return false; }
  }
  var CSS = [
    "#bk-gate{position:fixed;inset:0;z-index:2147483647;background:#00348C;",
    "font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center}",
    "#bk-gate .bkc{background:#fff;border-radius:10px;padding:44px 36px;width:340px;max-width:88vw;",
    "box-shadow:0 20px 60px rgba(0,31,84,.4);text-align:center}",
    "#bk-gate h1{font-size:20px;letter-spacing:.12em;color:#00348C;margin:0 0 6px}",
    "#bk-gate h1 span{color:#0A9DDE}",
    "#bk-gate p{font-size:14px;color:#8593A6;margin:0 0 24px}",
    "#bk-gate input{width:100%;box-sizing:border-box;padding:13px 14px;font-size:15px;",
    "border:1px solid #C7D0DE;border-radius:6px;outline:none;margin-bottom:12px}",
    "#bk-gate input:focus{border-color:#0A9DDE}",
    "#bk-gate button{width:100%;padding:13px;background:#FED608;color:#00348C;border:none;",
    "border-radius:6px;font-weight:700;font-size:15px;cursor:pointer}",
    "#bk-gate button:hover{background:#00348C;color:#fff}",
    "#bk-gate .bke{color:#C0392B;font-size:13px;min-height:16px;margin:0 0 10px}"
  ].join("");
  function build() {
    if (unlocked() || document.getElementById("bk-gate")) return;
    var g = document.createElement("div");
    g.id = "bk-gate";
    var st = document.createElement("style"); st.textContent = CSS; g.appendChild(st);
    var c = document.createElement("div"); c.className = "bkc";
    c.innerHTML = "<h1>BARAKA <span>INVEST</span></h1>" +
      "<p>This site is not yet public.<br>Enter the password to continue.</p>" +
      "<div class=\"bke\" id=\"bk-err\"></div>" +
      "<input id=\"bk-pw\" type=\"password\" placeholder=\"Password\" autocomplete=\"current-password\">" +
      "<button id=\"bk-go\" type=\"button\">Enter</button>";
    g.appendChild(c);
    (document.body || document.documentElement).appendChild(g);
    function tryUnlock() {
      var inp = document.getElementById("bk-pw");
      if (inp && inp.value === PW) {
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        g.parentNode && g.parentNode.removeChild(g);
      } else {
        var er = document.getElementById("bk-err");
        if (er) er.textContent = "Incorrect password - please try again.";
        if (inp) { inp.value = ""; inp.focus(); }
      }
    }
    document.getElementById("bk-go").addEventListener("click", tryUnlock);
    document.getElementById("bk-pw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") tryUnlock();
    });
    document.getElementById("bk-pw").focus();
  }
  build();
  // Re-assert in case the page loader rewrites the DOM after boot.
  var t = setInterval(function () {
    if (unlocked()) { clearInterval(t); var g = document.getElementById("bk-gate"); if (g) g.remove(); return; }
    build();
  }, 400);
})();

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x; margin-top:80px; padding-top:36px; border-top:1px solid rgba(255,255,255,0.15); flex-wrap:wrap;\">\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">17,040<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Companies evaluated<\/div><\/div>\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">696<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Reports, this cycle<\/div><\/div>\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">15<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Markets \u00b7 one process<\/div><\/div>\n      <div><div style=\"font-family:'Cinzel',serif; font-size:34px; color:#ffffff;\">2<\/div><div style=\"font-size:14px; color:#C9D5EA; margin-top:4px;\">Editions \u00b7 Conventional &amp; Shariah<\/div><\/div>\n    <\/div>\n    <p style=\"margin:22px 0 0; font-size:14px; color:#C9D5EA; line-height:1.65; max-width:720px; font-weight:300;\">Report counts are as of the latest quarterly review. A report exists only where companies currently qualify under our selection process \u2014 counts change each cycle as fundamentals and standings evolve. That selectivity is the product.<\/p>\n  <\/div>\n<\/header>\n\n<section id=\"coverage\" style=\"padding:110px 0;\">\n  <div class=\"wrap\">\n    <p class=\"kicker\">COVERAGE<\/p>\n    <h2 class=\"sec\" style=\"max-width:760px;\">One process, four altitudes<\/h2>\n    <p style=\"margin:0 0 44px; font-size:17px; line-height:1.7; max-width:660px;\">Every report family shares the same audited data spine \u2014 so an industry report, its sector report, its country report and the global view always agree, line for line. Each is published in a Conventional and a Shariah edition.<\/p>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:24px;\">\n      <div class=\"card\"><div style=\"font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.12em; color:#00348C; font-weight:600;\">INDUSTRY REPORTS<\/div><p style=\"margin:0; font-size:15px; line-height:1.65;\">The sharpest lens: selected companies with weights and selection dates, marked price charts, full cycle history \u2014 and a deep dive on every holding.<\/p><div style=\"margin-top:auto; font-size:13px; color:#8593A6; letter-spacing:0.04em;\">454 industry reports \u00b7 both editions<\/div><\/div>\n      <div class=\"card\"><div style=\"font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.12em; color:#00348C; font-weight:600;\">SECTOR REPORTS<\/div><p style=\"margin:0; font-size:15px; line-height:1.65;\">Every industry inside a sector: what the universe holds, what was selected and why it earns its allocation, with per-industry track records.<\/p><div style=\"margin-top:auto; font-size:13px; color:#8593A6; letter-spacing:0.04em;\">214 sector reports \u00b7 both editions<\/div><\/div>\n      <div class=\"card\"><div style=\"font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.12em; color:#00348C; font-weight:600;\">COUNTRY REPORTS<\/div><p style=\"margin:0; font-size:15px; line-height:1.65;\">The whole market at a glance: universe coverage, sector allocation, top holdings, the complete track record and every industry \u2014 one document per market.<\/p><div style=\"margin-top:auto; font-size:13px; color:#8593A6; letter-spacing:0.04em;\">26 country reports \u00b7 incl. pooled GCC<\/div><\/div>\n      <div class=\"card\" style=\"border-top-color:#FED608;\"><div style=\"font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.12em; color:#00348C; font-weight:600;\">GLOBAL REPORTS<\/div><p style=\"margin:0; font-size:15px; line-height:1.65;\">New: one industry or one sector across every covered market in a single document \u2014 plus the two Global Portfolio flagships that gather the whole selection.<\/p><div style=\"margin-top:auto; font-size:13px; color:#8593A6; letter-spacing:0.04em;\">110 global reports + 2 flagships<\/div><\/div>\n    <\/div>\n    <div style=\"margin-top:48px; border-left:3px solid #FED608; background:#F5F8FC; padding:28px 32px; max-width:900px;\">\n      <div style=\"font-family:'Cinzel',serif; font-size:17px; letter-spacing:0.04em; color:#00348C; font-weight:600; margin-bottom:10px;\">Why these numbers change<\/div>\n      <p style=\"margin:0; font-size:15px; line-height:1.75;\">A report exists only where companies currently qualify under BARAKA Invest's selection process. Coverage counts change at each quarterly review as company fundamentals and standings evolve \u2014 a report that disappears means the selection moved on, not that coverage failed. The universe each market is evaluated against is shown alongside, so you can always see how selective the current cycle is.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"methodology\" style=\"padding:110px 0; background:#00348C;\">\n  <div class=\"wrap\">\n    <p class=\"kicker\" style=\"color:#FED608;\">METHODOLOGY<\/p>\n    <h2 class=\"sec\" style=\"color:#ffffff;\">The methodology is proprietary. The discipline is public.<\/h2>\n    <p style=\"margin:0 0 52px; font-size:17px; line-height:1.7; max-width:620px; color:#C9D5EA;\">Five steps, run for every company in every market, every quarter.<\/p>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:20px;\">\n      <div style=\"border:1px solid rgba(255,255,255,0.16); border-top:3px solid #FED608; background:rgba(255,255,255,0.04); padding:30px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.16em; color:#FED608; margin-bottom:16px;\">1 \u00b7 EVALUATE<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">Quarterly financial statements for every listed company in each market \u2014 normalized, quality-checked, point-in-time.<\/p><\/div>\n      <div style=\"border:1px solid rgba(255,255,255,0.16); border-top:3px solid #FED608; background:rgba(255,255,255,0.04); padding:30px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.16em; color:#FED608; margin-bottom:16px;\">2 \u00b7 SELECT<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">A proprietary multi-factor evaluation identifies the strongest companies in every industry, on one measurable standard. No stories, no exceptions.<\/p><\/div>\n      <div style=\"border:1px solid rgba(255,255,255,0.16); border-top:3px solid #FED608; background:rgba(255,255,255,0.04); padding:30px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.16em; color:#FED608; margin-bottom:16px;\">3 \u00b7 SCREEN<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">The Shariah edition applies an AAOIFI-aligned two-stage compliance screen on top of the same selection \u2014 additive, never a different process.<\/p><\/div>\n      <div style=\"border:1px solid rgba(255,255,255,0.16); border-top:3px solid #FED608; background:rgba(255,255,255,0.04); padding:30px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.16em; color:#FED608; margin-bottom:16px;\">4 \u00b7 MEASURE<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">Total-return performance from each holding's own inclusion date, compounded across quarterly cycles, benchmarked to each market's index.<\/p><\/div>\n      <div style=\"border:1px solid rgba(255,255,255,0.16); border-top:3px solid #FED608; background:rgba(255,255,255,0.04); padding:30px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.16em; color:#FED608; margin-bottom:16px;\">5 \u00b7 REFRESH<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">Every report is ordinarily refreshed each quarter after the portfolio review \u2014 and the latest issue always supersedes the last.<\/p><\/div>\n    <\/div>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-top:44px;\">\n      <div style=\"border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.04); padding:26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.14em; color:#0A9DDE; margin-bottom:12px;\">POINT-IN-TIME, NEVER HINDSIGHT<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">Every historical cycle uses only the information available on its decision date. Backtests are labelled as backtests; live performance begins February 2026 and is marked as such.<\/p><\/div>\n      <div style=\"border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.04); padding:26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.14em; color:#0A9DDE; margin-bottom:12px;\">ONE STANDARD, EVERYWHERE<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">Total return including dividends where available, measured from each holding's own inclusion date, benchmarked to each market's leading index in local currency \u2014 the same rules in every report, every market, every edition.<\/p><\/div>\n      <div style=\"border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.04); padding:26px;\"><div style=\"font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.14em; color:#0A9DDE; margin-bottom:12px;\">AUDITED, LINE FOR LINE<\/div><p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#C9D5EA;\">Every build runs an audit: each global holding traces to its country portfolio, every table reconciles to the books, and the audit manifest is retained. An industry report, its sector report and the global view never disagree.<\/p><\/div>\n    <\/div>\n    <p style=\"margin:36px 0 0; font-size:14px; color:#8FA6CC; line-height:1.75; max-width:860px; border-top:1px solid rgba(255,255,255,0.14); padding-top:22px;\">The selection mechanics \u2014 factors, thresholds, weights and construction rules \u2014 are trade secrets of BARAKA Invest and are never published, licensed or discussed. What we publish, and stand behind, is the output and the discipline around it: the selections, their dates, and their measured record.<\/p>\n  <\/div>\n<\/section>\n\n<section id=\"performance\" style=\"padding:110px 0; background:#F5F8FC;\">\n  <div style=\"max-width:1000px; margin:0 auto; padding:0 32px;\">\n    <p class=\"kicker\">THE RECORD<\/p>\n    <h2 class=\"sec\">Stated plainly, on one standard<\/h2>\n    <p style=\"margin:0 0 44px; font-size:17px; line-height:1.7; max-width:720px;\">Total return including dividends where total-return data is available, compounded across real quarterly cycles, benchmarked to each market's leading index. Figures are backtested before February 2026 and live thereafter. The right-hand column is outperformance versus the stated benchmark over the same window.<\/p>\n    <div style=\"border:1px solid #E4EAF4; background:#ffffff;\">\n      <div style=\"display:grid; grid-template-columns:1fr auto auto auto; gap:28px; padding:14px 30px; background:#00348C;\">\n        <div style=\"font-size:11px; letter-spacing:0.1em; color:#7CC7EC; font-weight:700;\">TRACK / SELECTION<\/div>\n        <div style=\"font-size:11px; letter-spacing:0.1em; color:#7CC7EC; font-weight:700; text-align:right;\">BARAKA<\/div>\n        <div style=\"font-size:11px; letter-spacing:0.1em; color:#7CC7EC; font-weight:700; text-align:right; min-width:150px;\">BENCHMARK<\/div>\n        <div style=\"font-size:11px; letter-spacing:0.1em; color:#7CC7EC; font-weight:700; text-align:right; min-width:96px;\">VS BENCH<\/div>\n      <\/div>\n      <div style=\"display:grid; grid-template-columns:1fr auto auto auto; gap:28px; align-items:center; padding:22px 30px; border-bottom:1px solid #E4EAF4;\"><div><div style=\"font-weight:700; font-size:16px; color:#00348C;\">United States \u2014 Selection \u00b7 Conventional<\/div><div style=\"font-size:13.5px; color:#8593A6; m ize:12px; color:#8593A6; margin-top:2px;\">outperf.<\/div><\/div><\/div>\n      <div style=\"display:grid; grid-template-columns:1fr auto auto auto; gap:28px; align-items:center; padding:22px 30px; border-bottom:1px solid #E4EAF4;\"><div><div style=\"font-weight:700; font-size:16px; color:#00348C;\">Global Portfolio \u2014 live<\/div><div style=\"font-size:13.5px; color:#8593A6; margin-top:3px;\">383 holdings \u00b7 15 markets \u00b7 since inclusion (Feb 2026) \u00b7 actual weights<\/div><\/div><div style=\"text-align:right;\"><div style=\"font-family:'Cinzel',serif; font-size:26px; color:#1E7F3E;\">+42.0%<\/div><div style=\"font-size:12px; color:#8593A6; margin-top:2px;\">BARAKA Invest<\/div><\/div><div style=\"text-align:right; min-width:150px;\"><div style=\"font-family:'Cinzel',serif; font-size:20px; color:#3D4756;\">+3.1%<\/div><div style=\"font-size:12px; color:#8593A6; margin-top:2px;\">Local benchmarks (blended)<\/div><\/div><div style=\"text-align:right; min-width:96px;\"><div style=\"font-family:'Cinzel',serif; font-size:20px; color:#0A9DDE;\">+38.8pp<\/div><div style=\"font-size:12px; color:#8593A6; margin-top:2px;\">outperf.<\/div><\/div><\/div>\n      <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:#E4EAF4;\">\n        <div style=\"background:#F7F9FC; padding:24px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:30px; color:#1E7F3E;\">88%<\/div><div style=\"font-size:12.5px; margin-top:5px; line-height:1.45;\">United States: quarterly beat rate vs S&amp;P 500<\/div><\/div>\n        <div style=\"background:#F7F9FC; padding:24px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:30px; color:#00348C;\">\u22127.0%<\/div><div style=\"font-size:12.5px; margin-top:5px; line-height:1.45;\">Worst single month \u2014 US selection, 8 cycles (equal-amount)<\/div><\/div>\n        <div style=\"background:#F7F9FC; padding:24px 26px;\"><div style=\"font-family:'Cinzel',serif; font-size:30px; color:#00348C;\">8<\/di (four to eight per market by filing history). Backtested before February 2026; cycle counts and spans differ, so figures are not directly comparable across markets. We publish the weak markets next to the strong ones \u2014 that honesty is part of the product.<\/p>\n    <div class=\"grid-markets\" id=\"marketsGrid\"><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"global\" style=\"padding:110px 0; background:#ffffff;\">\n  <div class=\"wrap\">\n    <p class=\"kicker\">NEW \u00b7 THE GLOBAL FAMILY<\/p>\n    <h2 class=\"sec\" style=\"max-width:820px;\">One industry. Every market. One document.<\/h2>\n    <div class=\"cols2\" style=\"display:grid; grid-template-columns:1.05fr 1fr; gap:72px; align-items:start;\">\n      <div>\n        <p style=\"margin:0 0 20px; font-size:17px; line-height:1.75; font-weight:300;\">The Global Industry and Global Sector Reports slice the entire estate horizontally: Semiconductors across six markets, Banks across nine, each company benchmarked against its own market's leading index in local currency \u2014 with per-market track records shown side by side, never blended.<\/p>\n        <p style=\"margin:0 0 20px; font-size:17px; line-height:1.75; font-weight:300;\">Behind them sits the <b>Global Portfolio<\/b> \u2014 and one rule: <b>in every market, the global portfolio holds exactly the companies selected by that market's own BARAKA Invest portfolio.<\/b> Inclusion is identical to the per-market reports; only the capital weights differ, set by our evidence-based global allocation and diversification caps.<\/p>\n        <div style=\"display:flex; gap:44px; flex-wrap:wrap; margin-top:28px;\">\n          <div><div style=\"font-family:'Cinzel',serif; font-size:30px; color:#00348C;\">110<\/div><div style=\"font-size:13px; color:#8593A6; margin-top:3px;\">Global industry &amp; sector reports<\/div><\/div>\n          <div><div style=\"font-family:'Cinzel',serif; font-size:30px; color:#00348C;\">383<\/div><div style=\"font-size:13px; color:#8593A6 vestment.' }\n];\n\n// ---------- state + render ----------\nvar S = { scope: 'industry', edition: 'conv', billing: 'single',\n          market: 'United States', sector: 'Information Technology', industry: 'Semiconductors' };\nfunction fmt(n) { if (n == null) return '\u2014'; return '$' + (Math.round(n / 5) * 5).toLocaleString('en-US'); }\nfunction esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }\n\nfunction render() {\n  var sc = SCOPES.filter(function(s){ return s.id === S.scope; })[0];\n  var isFull = sc.id === 'full', noEd = isFull || sc.id === 'custom';\n  var needsMarket = ['industry','sector','country'].indexOf(sc.id) >= 0;\n  var needsSector = sc.id === 'industry' || sc.id === 'sector';\n  var needsIndustry = sc.id === 'industry';\n  var mktList = sc.id === 'country' ? COUNTRY_NAMES : MARKET_NAMES;\n  if (mktList.indexOf(S.market) < 0) S.market = mktList[0];\n  var isGlobalPick = needsMarket && S.market === 'Global \u2014 All Markets' && sc.globalSingle;\n  var inds = INDS[S.sector] || INDS['Information Technology'];\n  if (inds.indexOf(S.industry) < 0) S.industry = inds[0];\n  var ed = EDITIONS.filter(function(e){ return e.id === S.edition; })[0];\n  var mult = noEd ? 1 : ed.mult;\n  var baseSingle = isGlobalPick ? sc.globalSingle : sc.single;\n  var baseSub = isGlobalPick ? sc.globalSub : sc.sub;\n  if (sc.sub == null && S.billing === 'sub') S.billing = 'single';\n\n  var chips = '';\n  SCOPES.forEach(function(s) {\n    chips += '<button class=\"chip' + (s.id === S.scope ? ' sel' : '') + '\" onclick=\"S.scope=\\'' + s.id + '\\';render();\">' + esc(s.name) + '<\/button>';\n  });\n  document.getElementById('scopeChips').innerHTML = chips;\n\n  var edrows = '';\n  EDITIONS.forEach(function(e) {\n    var sel = !noEd && e.id === S.edition;\n    var desc = noEd ? (isFull ? 'Included \u2014 the full estate carries both editions.' : 'Pick Conventional or Shariah when you send your company list.') : e.desc;\n    edrows += '<b
