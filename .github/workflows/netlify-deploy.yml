name: Deploy Agent HQ to Netlify

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Netlify site ID to deploy to
        required: true
        type: string
      proxy_path:
        description: Netlify MCP deploy proxy URL (short-lived, scoped to build upload)
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy agent-hq folder
        env:
          SITE_ID: ${{ inputs.site_id }}
          PROXY_PATH: ${{ inputs.proxy_path }}
        run: |
          echo "::add-mask::$PROXY_PATH"
          cp font-02.woff2 font-04.woff2 font-06.woff2 font-08.woff2 agent-hq/
          cd agent-hq
          npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$PROXY_PATH"
